version: '3.8'

services:
  # ApertureDB - multimodal database
  aperturedb:
    image: aperturedata/aperturedb:latest
    ports:
      - "5555:5555"
    environment:
      - APERTUREDB_API_KEY=changeme
    volumes:
      - aperturedb_data:/data

  # MemMachine - memory layer
  memmachine:
    image: ghcr.io/memmachine/memmachine:latest
    ports:
      - "7860:7860"
    environment:
      - MEMMACHINE_API_KEY=changeme
    volumes:
      - memmachine_data:/data

  # Node.js backend
  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - APERTUREDB_URL=http://aperturedb:5555
      - MEMMACHINE_URL=http://memmachine:7860
    env_file:
      - .env
    depends_on:
      - aperturedb
      - memmachine
    volumes:
      - ./server:/app/server
      - ./captures:/app/captures

volumes:
  aperturedb_data:
  memmachine_data:
